<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de recettes</title>
<meta name="theme-color" content="#f2f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="wrap top">
  <div class="brand">
    <h1>Carnet de recettes</h1>
    <p id="subtitle">&nbsp;</p>
  </div>
  <div class="top-actions">
    <button class="btn" id="btn-install" type="button" hidden>Installer</button>
    <button class="btn primary" id="btn-add" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Ajouter
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="searchrow">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Rechercher un plat, un ingrédient…" autocomplete="off">
      </label>
      <button class="toggle-fav" id="btn-fav" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3.1 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.8 0 6 3.8 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>
        <span class="t">Favoris</span>
      </button>
    </div>
    <div class="seg" id="seasons" role="group" aria-label="Saison"></div>
    <div class="chips" id="cats" role="group" aria-label="Catégorie"></div>
  </div>
</div>

<main class="wrap">
  <div id="banner"></div>
  <div id="grid" class="grid"></div>
</main>

<section class="sheet" id="detail" hidden aria-label="Recette"></section>
<section class="sheet" id="editor" hidden aria-label="Modifier la recette"></section>
<section class="sheet" id="importer" hidden aria-label="Importer une recette"></section>

<div class="login" id="login" hidden>
  <form id="login-form" novalidate>
    <img class="logo" src="/icons/icon-192.png" alt="">
    <h1>Carnet de recettes</h1>
    <p>Entre le mot de passe pour ouvrir ton carnet.</p>
    <label for="pwd" class="sr" style="position:absolute;left:-9999px">Mot de passe</label>
    <input class="input" id="pwd" type="password" autocomplete="current-password" placeholder="Mot de passe">
    <button class="btn primary" type="submit" id="login-btn">Ouvrir</button>
    <p id="login-err" style="color:var(--danger)" hidden></p>
  </form>
</div>

<div class="backdrop" id="dlg" hidden><div class="dialog" id="dlg-box" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
